<svg viewBox="0 0 1180 1720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>SafePassenger — People Counting mental model</title>
  <desc>Digital mental model: POO, Bus Operator, Bus (Device health has four branches), Trips (API data), and Trip Running.</desc>
  <style>
    .band{fill:#f6f9fd;stroke:#d4def0;}
    .sec{fill:#1e4fa3;font-size:13px;font-weight:700;letter-spacing:.02em;}
    .root{fill:#1e4fa3;}
    .rootT{fill:#ffffff;font-size:15px;font-weight:700;text-anchor:middle;}
    .nodeR{fill:#eef3fb;stroke:#9db6de;}
    .leafR{fill:#ffffff;stroke:#9db6de;}
    .wideR{fill:#ffffff;stroke:#9db6de;}
    .t{fill:#1e2a3a;font-size:12px;}
    .tm{fill:#5b6b82;font-size:11px;}
    .edge{stroke:#9db6de;stroke-width:1.4;fill:none;}
  </style>
  <rect x="0" y="0" width="1180" height="1720" fill="#ffffff"/>

  <!-- POO -->
  <rect class="band" x="14" y="46" width="1152" height="300" rx="12"/>
  <text class="sec" x="30" y="38">POO — Product Owner Operator</text>
  <ellipse class="root" cx="96" cy="196" rx="52" ry="34"/><text class="rootT" x="96" y="201">POO</text>
  <line class="edge" x1="148" y1="196" x2="250" y2="80"/>
  <line class="edge" x1="148" y1="196" x2="250" y2="124"/>
  <line class="edge" x1="148" y1="196" x2="250" y2="168"/>
  <line class="edge" x1="148" y1="196" x2="250" y2="212"/>
  <line class="edge" x1="148" y1="196" x2="250" y2="256"/>
  <line class="edge" x1="148" y1="196" x2="250" y2="314"/>
  <g class="node"><rect class="nodeR" x="250" y="64" width="230" height="32" rx="8"/><text class="t" x="266" y="84">Interacts with BO</text></g>
  <g class="node"><rect class="nodeR" x="250" y="108" width="230" height="32" rx="8"/><text class="t" x="266" y="128">Verifies data + final count</text></g>
  <g class="node"><rect class="nodeR" x="250" y="152" width="230" height="32" rx="8"/><text class="t" x="266" y="172">Verifies multiple fleets</text></g>
  <g class="node"><rect class="nodeR" x="250" y="196" width="230" height="32" rx="8"/><text class="t" x="266" y="216">Alerts</text></g>
  <g class="node"><rect class="nodeR" x="250" y="240" width="230" height="32" rx="8"/><text class="t" x="266" y="260">Sends final count to BO</text></g>
  <g class="wide"><rect class="wideR" x="250" y="298" width="620" height="32" rx="8"/><text class="tm" x="266" y="318">Primary screens: Dashboard · Trip Summary · Device health</text></g>
  <line class="edge" x1="480" y1="212" x2="510" y2="195"/>
  <line class="edge" x1="480" y1="212" x2="510" y2="231"/>
  <g class="leaf"><rect class="leafR" x="510" y="180" width="150" height="30" rx="8"/><text class="t" x="524" y="199">Tampering</text></g>
  <g class="leaf"><rect class="leafR" x="510" y="216" width="300" height="30" rx="8"/><text class="t" x="524" y="235">Unscheduled boarding / drop-off</text></g>

  <!-- BO -->
  <rect class="band" x="14" y="382" width="1152" height="188" rx="12"/>
  <text class="sec" x="30" y="374">BO — Bus Operator</text>
  <ellipse class="root" cx="96" cy="470" rx="52" ry="34"/><text class="rootT" x="96" y="475">BO</text>
  <line class="edge" x1="148" y1="470" x2="250" y2="416"/>
  <line class="edge" x1="148" y1="470" x2="250" y2="460"/>
  <line class="edge" x1="148" y1="470" x2="250" y2="504"/>
  <line class="edge" x1="148" y1="470" x2="250" y2="548"/>
  <g class="node"><rect class="nodeR" x="250" y="400" width="280" height="32" rx="8"/><text class="t" x="266" y="420">Interacts with drivers &amp; conductors</text></g>
  <g class="node"><rect class="nodeR" x="250" y="444" width="230" height="32" rx="8"/><text class="t" x="266" y="464">Tracks all his buses</text></g>
  <g class="node"><rect class="nodeR" x="250" y="488" width="230" height="32" rx="8"/><text class="t" x="266" y="508">Checks analysis</text></g>
  <g class="wide"><rect class="wideR" x="250" y="532" width="230" height="32" rx="8"/><text class="tm" x="266" y="552">Primary screen: Dashboard</text></g>

  <!-- BUS -->
  <rect class="band" x="14" y="606" width="1152" height="392" rx="12"/>
  <text class="sec" x="30" y="598">Bus</text>
  <ellipse class="root" cx="96" cy="785" rx="52" ry="34"/><text class="rootT" x="96" y="790">Bus</text>
  <line class="edge" x1="148" y1="785" x2="250" y2="626"/>
  <line class="edge" x1="148" y1="785" x2="250" y2="786"/>
  <line class="edge" x1="148" y1="785" x2="250" y2="900"/>
  <line class="edge" x1="148" y1="785" x2="250" y2="944"/>
  <g class="node"><rect class="nodeR" x="250" y="610" width="200" height="32" rx="8"/><text class="t" x="266" y="630">Device health</text></g>
  <g class="node"><rect class="nodeR" x="250" y="770" width="200" height="32" rx="8"/><text class="t" x="266" y="790">Trips</text></g>
  <g class="node"><rect class="nodeR" x="250" y="884" width="270" height="32" rx="8"/><text class="t" x="266" y="904">Onboarding + install (manual)</text></g>
  <g class="node"><rect class="nodeR" x="250" y="928" width="270" height="32" rx="8"/><text class="t" x="266" y="948">Has drivers &amp; conductors</text></g>

  <!-- Device health: four branches -->
  <line class="edge" x1="450" y1="626" x2="510" y2="609"/>
  <line class="edge" x1="450" y1="626" x2="510" y2="647"/>
  <line class="edge" x1="450" y1="626" x2="510" y2="685"/>
  <line class="edge" x1="450" y1="626" x2="510" y2="723"/>
  <g class="leaf"><rect class="leafR" x="510" y="594" width="220" height="30" rx="8"/><text class="t" x="524" y="613">Real-time device pulse</text></g>
  <g class="leaf"><rect class="leafR" x="510" y="632" width="220" height="30" rx="8"/><text class="t" x="524" y="651">Technical issues</text></g>
  <g class="leaf"><rect class="leafR" x="510" y="670" width="220" height="30" rx="8"/><text class="t" x="524" y="689">Resolution</text></g>
  <g class="leaf"><rect class="leafR" x="510" y="708" width="220" height="30" rx="8"/><text class="t" x="524" y="727">Escalation</text></g>

  <!-- Trips: four branches -->
  <line class="edge" x1="450" y1="786" x2="510" y2="763"/>
  <line class="edge" x1="450" y1="786" x2="510" y2="801"/>
  <line class="edge" x1="450" y1="786" x2="510" y2="839"/>
  <line class="edge" x1="450" y1="786" x2="510" y2="877"/>
  <g class="leaf"><rect class="leafR" x="510" y="748" width="200" height="30" rx="8"/><text class="t" x="524" y="767">Rest stops</text></g>
  <g class="leaf"><rect class="leafR" x="510" y="786" width="220" height="30" rx="8"/><text class="t" x="524" y="805">Unscheduled boarding</text></g>
  <g class="leaf"><rect class="leafR" x="510" y="824" width="200" height="30" rx="8"/><text class="t" x="524" y="843">Unscheduled drop</text></g>
  <g class="leaf"><rect class="leafR" x="510" y="862" width="200" height="30" rx="8"/><text class="t" x="524" y="881">Passenger counting</text></g>

  <!-- TRIPS / API DATA -->
  <rect class="band" x="14" y="1034" width="1152" height="320" rx="12"/>
  <text class="sec" x="30" y="1026">Trips — API data</text>
  <ellipse class="root" cx="96" cy="1170" rx="52" ry="34"/><text class="rootT" x="96" y="1175">Trips</text>
  <line class="edge" x1="148" y1="1170" x2="250" y2="1086"/>
  <line class="edge" x1="148" y1="1170" x2="250" y2="1166"/>
  <line class="edge" x1="148" y1="1170" x2="250" y2="1226"/>
  <g class="node"><rect class="nodeR" x="250" y="1070" width="200" height="32" rx="8"/><text class="t" x="266" y="1090">Start / End</text></g>
  <g class="node"><rect class="nodeR" x="250" y="1150" width="200" height="32" rx="8"/><text class="t" x="266" y="1170">All stops</text></g>
  <g class="node"><rect class="nodeR" x="250" y="1210" width="200" height="32" rx="8"/><text class="t" x="266" y="1230">Passengers</text></g>
  <line class="edge" x1="450" y1="1086" x2="510" y2="1069"/>
  <line class="edge" x1="450" y1="1086" x2="510" y2="1107"/>
  <g class="leaf"><rect class="leafR" x="510" y="1054" width="180" height="30" rx="8"/><text class="t" x="524" y="1073">Destination</text></g>
  <g class="leaf"><rect class="leafR" x="510" y="1092" width="200" height="30" rx="8"/><text class="t" x="524" y="1111">Timings (approx)</text></g>
  <line class="edge" x1="450" y1="1226" x2="510" y2="1226"/>
  <g class="leaf"><rect class="leafR" x="510" y="1211" width="150" height="30" rx="8"/><text class="t" x="524" y="1230">Boarding</text></g>
  <line class="edge" x1="660" y1="1226" x2="710" y2="1226"/>
  <g class="leaf"><rect class="leafR" x="710" y="1211" width="150" height="30" rx="8"/><text class="t" x="724" y="1230">Drop-off</text></g>
  <g class="wide"><rect class="wideR" x="250" y="1288" width="820" height="46" rx="8"/>
    <text class="tm" x="266" y="1310">Sequence:  Trip starts → Boarding starts → People counting →</text>
    <text class="tm" x="266" y="1327">Scheduled  /  Unscheduled ( + or − )</text>
  </g>

  <!-- TRIP RUNNING -->
  <rect class="band" x="14" y="1390" width="1152" height="310" rx="12"/>
  <text class="sec" x="30" y="1382">Trip Running</text>
  <rect x="44" y="1500" width="108" height="56" rx="10" fill="#1e4fa3"/>
  <text class="rootT" x="98" y="1533">Trip Running</text>
  <line class="edge" x1="152" y1="1528" x2="250" y2="1446"/>
  <line class="edge" x1="152" y1="1528" x2="250" y2="1526"/>
  <line class="edge" x1="152" y1="1528" x2="250" y2="1570"/>
  <line class="edge" x1="152" y1="1528" x2="250" y2="1614"/>
  <g class="node"><rect class="nodeR" x="250" y="1430" width="200" height="32" rx="8"/><text class="t" x="266" y="1450">Stops</text></g>
  <g class="node"><rect class="nodeR" x="250" y="1510" width="270" height="32" rx="8"/><text class="t" x="266" y="1530">Device health (see Bus)</text></g>
  <g class="node"><rect class="nodeR" x="250" y="1554" width="200" height="32" rx="8"/><text class="t" x="266" y="1574">Tampering</text></g>
  <g class="node"><rect class="nodeR" x="250" y="1598" width="200" height="32" rx="8"/><text class="t" x="266" y="1618">Boarding / Drop</text></g>
  <line class="edge" x1="450" y1="1446" x2="510" y2="1429"/>
  <line class="edge" x1="450" y1="1446" x2="510" y2="1467"/>
  <line class="edge" x1="450" y1="1446" x2="510" y2="1505"/>
  <g class="leaf"><rect class="leafR" x="510" y="1414" width="180" height="30" rx="8"/><text class="t" x="524" y="1433">Adhoc stops</text></g>
  <g class="leaf"><rect class="leafR" x="510" y="1452" width="180" height="30" rx="8"/><text class="t" x="524" y="1471">Food stops</text></g>
  <g class="leaf"><rect class="leafR" x="510" y="1490" width="180" height="30" rx="8"/><text class="t" x="524" y="1509">Rest stops</text></g>
  <line class="edge" x1="450" y1="1614" x2="510" y2="1551"/>
  <line class="edge" x1="450" y1="1614" x2="510" y2="1589"/>
  <line class="edge" x1="450" y1="1614" x2="510" y2="1627"/>
  <line class="edge" x1="450" y1="1614" x2="510" y2="1665"/>
  <g class="leaf"><rect class="leafR" x="510" y="1536" width="200" height="30" rx="8"/><text class="t" x="524" y="1555">Scheduled</text></g>
  <g class="leaf"><rect class="leafR" x="510" y="1574" width="200" height="30" rx="8"/><text class="t" x="524" y="1593">Unscheduled</text></g>
  <g class="leaf"><rect class="leafR" x="510" y="1612" width="200" height="30" rx="8"/><text class="t" x="524" y="1631">Drop-off</text></g>
  <g class="leaf"><rect class="leafR" x="510" y="1650" width="200" height="30" rx="8"/><text class="t" x="524" y="1669">Unscheduled drop</text></g>
</svg>
